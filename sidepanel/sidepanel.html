<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../styles/common.css">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel">
    <header>
      <h1>Debug Helper</h1>
      <div style="display:flex;gap:6px;align-items:center">
        <button id="btn-quick-export" class="btn btn-sm" title="Quick export: copy markdown to clipboard">Quick Copy</button>
        <button id="btn-record" class="btn btn-sm btn-record" title="Start recording">Record</button>
        <div id="status" class="status-badge">Idle</div>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="feed">Live Feed</button>
      <button class="tab" data-tab="screenshots">Media</button>
      <button class="tab" data-tab="history">History</button>
      <button class="tab" data-tab="export">Export</button>
    </nav>

    <div class="filters" id="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="event:dom">DOM</button>
      <button class="filter-btn" data-filter="event:console">Console</button>
      <button class="filter-btn" data-filter="event:network">Network</button>
      <button class="filter-btn" data-filter="event:note">Notes</button>
      <button class="filter-btn" data-filter="media">Media</button>
      <button class="filter-btn hidden" data-filter="in-range" id="filter-btn-in-range" title="Show only events within the selected range">In range</button>
      <button id="btn-autoscroll" class="scroll-btn" title="Toggle auto-scroll">Auto ↓</button>
    </div>

    <div class="note-bar hidden" id="note-bar">
      <input type="text" id="note-input" placeholder="Add a note or command..." autocomplete="off">
      <button id="btn-add-note" class="btn btn-sm btn-primary">Add</button>
      <button id="btn-feed-capture" class="btn btn-sm" title="Capture screenshot">Capture</button>
      <button id="btn-video" class="btn btn-sm btn-video" title="Record tab video">Video</button>
      <button id="btn-video-desktop" class="btn btn-sm btn-video" title="Record desktop / window / tab with system picker">🖥️</button>
    </div>

    <div class="range-bar hidden" id="range-bar">
      <span class="range-info" id="range-info"></span>
      <div class="range-actions">
        <button id="btn-range-clear" class="btn btn-sm">Clear</button>
        <button id="btn-range-export" class="btn btn-sm btn-primary" title="Open Export tab with this range applied">Export ⬇</button>
      </div>
    </div>

    <div class="range-timeline" id="range-timeline">
      <div class="timeline-labels">
        <span class="timeline-label-start" id="timeline-label-start">0:00</span>
        <span class="timeline-label-end" id="timeline-label-end">0:00</span>
      </div>
      <div class="timeline-track" id="timeline-track">
        <div class="timeline-ticks" id="timeline-ticks"></div>
        <div class="timeline-range" id="timeline-range"></div>
        <div class="timeline-handle timeline-handle-start" id="timeline-handle-start" data-handle="start"></div>
        <div class="timeline-handle timeline-handle-end" id="timeline-handle-end" data-handle="end"></div>
      </div>
    </div>

    <section id="tab-feed" class="tab-content active">
      <div id="feed" class="feed"></div>
    </section>

    <section id="tab-screenshots" class="tab-content">
      <div id="gallery" class="gallery"></div>
    </section>

    <section id="tab-history" class="tab-content">
      <div class="history-actions">
        <button id="btn-delete-selected" class="btn btn-sm" style="color:var(--danger)" disabled>Delete Selected</button>
        <button id="btn-select-all" class="btn btn-sm">Select All</button>
        <button id="btn-delete-all" class="btn btn-sm" style="color:var(--danger)">Delete All</button>
      </div>
      <div id="history-list"></div>
    </section>

    <section id="tab-export" class="tab-content">
      <div id="export-range-banner" class="export-range-banner hidden"></div>
      <div class="export-filters-group">
        <div class="filter-section">
          <div class="filter-section-title">Events</div>
          <label><input type="checkbox" data-filter="steps" checked> Steps</label>
          <label><input type="checkbox" data-filter="console" checked> Console</label>
          <label><input type="checkbox" data-filter="screenshots" checked> Screenshots</label>
        </div>
        <div class="filter-section">
          <div class="filter-section-title">Network</div>
          <label><input type="checkbox" data-filter="errorsOnly" checked> Errors only (4xx/5xx)</label>
          <label><input type="checkbox" data-filter="allRequests"> All (2xx/3xx/4xx/5xx)</label>
        </div>
        <div class="filter-section">
          <div class="filter-section-title">Clean up</div>
          <label><input type="checkbox" data-filter="dedup" checked> Deduplicate rapid clicks</label>
          <label><input type="checkbox" data-filter="skipScrollZero" checked> Skip scroll-to-0</label>
          <label><input type="checkbox" data-filter="screenshotAsFile" checked> Screenshots as files (no inline base64)</label>
        </div>
      </div>
      <div class="export-controls">
        <button id="btn-preview-md" class="btn">Preview Markdown</button>
        <button id="btn-preview-json" class="btn">Preview JSON</button>
        <button id="btn-preview-toon" class="btn">Preview TOON</button>
        <button id="btn-debug-events" class="btn" style="font-size:10px;opacity:0.6">Debug</button>
      </div>
      <div id="export-preview-wrap" class="hidden">
        <div class="export-preview-header">
          <span id="preview-info"></span>
          <button id="btn-play-videos" class="btn btn-sm" title="Open all videos in the current session in popup player" style="display:none">🎥 Play videos</button>
          <button id="btn-copy" class="btn btn-sm btn-primary">Copy to Clipboard</button>
          <button id="btn-download" class="btn btn-sm">Download ZIP</button>
        </div>
        <pre id="export-preview" class="export-preview"></pre>
      </div>
    </section>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
